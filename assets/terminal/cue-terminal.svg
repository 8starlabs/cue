<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="559" viewBox="0 0 1360 760" fill="none">
  <title>Cue terminal autocomplete preview</title>
  <desc>Apple Terminal showing git command suggestions for the typed input git c.</desc>
  <defs>
    <clipPath id="terminal-window-clip">
      <rect x="12" y="12" width="1336" height="736" rx="12" />
    </clipPath>
    <filter id="popup-shadow" x="-10%" y="-15%" width="125%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.34" />
    </filter>
  </defs>

  <g id="terminal-window">
    <g clip-path="url(#terminal-window-clip)">
      <rect x="12" y="12" width="1336" height="736" fill="#111315" />
      <rect x="12" y="12" width="1336" height="42" fill="#242628" />
      <path d="M12 54H1348" stroke="#373A3C" />

      <g id="window-controls">
        <circle cx="28" cy="33" r="5.5" fill="#EF6258" />
        <circle cx="47" cy="33" r="5.5" fill="#E8B44D" />
        <circle cx="66" cy="33" r="5.5" fill="#55BD66" />
      </g>

      <g id="window-title">
        <g transform="translate(655 25)" stroke="#9EABB0" stroke-linecap="round" stroke-width="1.2">
          <path d="M7 0v14M0 7h14M2 2l10 10M12 2 2 12" />
          <circle cx="7" cy="7" r="1.6" fill="#9EABB0" stroke="none" />
        </g>
        <text x="677" y="37" fill="#C7CCCE" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">Cue</text>
      </g>

      <text x="1320" y="36" text-anchor="end" fill="#777E81" font-family="Menlo, Monaco, monospace" font-size="11">zsh — 80×24</text>

      <g id="active-prompt" font-family="Menlo, Monaco, monospace" font-size="21">
        <text x="43" y="100">
          <tspan fill="#A0C9A9">dev@macbook</tspan>
          <tspan fill="#899397"> ~/project % </tspan>
          <tspan fill="#EEF0F1">git c</tspan>
        </text>
        <rect x="412" y="77" width="8" height="28" rx="1" fill="#D5DEE0" />
      </g>

      <g id="suggestion-list" filter="url(#popup-shadow)">
        <rect x="412" y="115" width="450" height="166" rx="7" fill="#2C2C2E" stroke="#414144" />

        <g id="selected-checkout-row">
          <rect x="418" y="121" width="438" height="34" rx="4" fill="#315FC7" />
          <rect x="456" y="127" width="11" height="20" rx="1" fill="#D7B84C" fill-opacity="0.58" />
          <rect x="427" y="128" width="20" height="20" rx="6" fill="#9251D1" />
          <text x="437" y="143" text-anchor="middle" fill="#FFFFFF" font-family="Menlo, Monaco, monospace" font-size="15" font-weight="600">$</text>
          <text x="456" y="144" fill="#FFFFFF" font-family="Menlo, Monaco, monospace" font-size="17" font-weight="700">checkout</text>
          <text x="549" y="144" fill="#C5D5F5" font-family="Menlo, Monaco, monospace" font-size="15">[branch, file, tag or commit]</text>
        </g>

        <g id="cherry-pick-row">
          <rect x="456" y="165" width="11" height="20" rx="1" fill="#D7B84C" fill-opacity="0.34" />
          <rect x="427" y="166" width="20" height="20" rx="6" fill="#9251D1" />
          <text x="437" y="181" text-anchor="middle" fill="#FFFFFF" font-family="Menlo, Monaco, monospace" font-size="15" font-weight="600">$</text>
          <text x="456" y="182" fill="#D1D1D3" font-family="Menlo, Monaco, monospace" font-size="17">cherry-pick</text>
          <text x="574" y="182" fill="#858588" font-family="Menlo, Monaco, monospace" font-size="15">&lt;commit&gt;</text>
        </g>

        <g id="commit-row">
          <rect x="456" y="203" width="11" height="20" rx="1" fill="#D7B84C" fill-opacity="0.34" />
          <rect x="427" y="204" width="20" height="20" rx="6" fill="#9251D1" />
          <text x="437" y="219" text-anchor="middle" fill="#FFFFFF" font-family="Menlo, Monaco, monospace" font-size="15" font-weight="600">$</text>
          <text x="456" y="220" fill="#D1D1D3" font-family="Menlo, Monaco, monospace" font-size="17">commit</text>
          <text x="525" y="220" fill="#858588" font-family="Menlo, Monaco, monospace" font-size="15">-m 'msg'</text>
        </g>

        <g id="clean-row">
          <rect x="456" y="241" width="11" height="20" rx="1" fill="#D7B84C" fill-opacity="0.34" />
          <rect x="427" y="242" width="20" height="20" rx="6" fill="#9251D1" />
          <text x="437" y="257" text-anchor="middle" fill="#FFFFFF" font-family="Menlo, Monaco, monospace" font-size="15" font-weight="600">$</text>
          <text x="456" y="258" fill="#D1D1D3" font-family="Menlo, Monaco, monospace" font-size="17">clean</text>
          <text x="516" y="258" fill="#858588" font-family="Menlo, Monaco, monospace" font-size="15">&lt;path&gt;</text>
        </g>
      </g>

      <g id="suggestion-description">
        <rect x="878" y="115" width="340" height="112" rx="7" fill="#39393C" stroke="#4A4A4D" />
        <text x="896" y="156" fill="#E6E8E9" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-style="italic">Switch branches or restore</text>
        <text x="896" y="180" fill="#E6E8E9" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-style="italic">working tree files</text>
        <text x="1195" y="209" text-anchor="end" fill="#999FA2" font-family="Menlo, Monaco, monospace" font-size="11">(⌘I)</text>
      </g>
    </g>
    <rect x="12.5" y="12.5" width="1335" height="735" rx="12" stroke="#35393B" />
  </g>
</svg>
